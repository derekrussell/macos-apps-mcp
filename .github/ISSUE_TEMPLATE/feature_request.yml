name: Feature request
description: Suggest a new tool or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For adding support for a **whole new app** (Calendar, Contacts, Messages, …), please use the "New app support" template instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or the gap you're hitting today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What tool or behaviour would you like? If it's a new tool, a proposed name and arguments help.
    validations:
      required: true
  - type: dropdown
    id: scope-check
    attributes:
      label: Scope check
      description: "This project is deliberately narrow: local, user-authorized access to Apple's built-in productivity apps, via AppleScript only. Does your request fit that?"
      options:
        - "Yes — it's an Apple built-in app, accessed via AppleScript"
        - "Not sure — happy to discuss"
        - "No / it goes beyond that scope"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using now, or other approaches you weighed.
    validations:
      required: false
